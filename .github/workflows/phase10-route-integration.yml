name: Phase 10 Route Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - official/phase-10-subject-page
    paths:
      - .github/workflows/phase10-route-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'phase-10-subject-page-implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-10-subject-page-implementation
          fetch-depth: 0
      - name: Patch subject details route and clean temporary files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('feature-home/src/main/java/app/masary/feature/home/ui/StudentHomePreparationRoute.kt')
          text = path.read_text(encoding='utf-8')

          if 'import app.masary.feature.subject.domain.SubjectRepository' not in text:
              anchor = 'import app.masary.feature.notifications.NotificationPermissionState\n'
              replacement = (
                  anchor
                  + 'import app.masary.feature.subject.domain.SubjectRepository\n'
                  + 'import app.masary.feature.subject.ui.StudentSubjectRoute\n'
              )
              if anchor not in text:
                  raise SystemExit('Phase 10 import anchor not found')
              text = text.replace(anchor, replacement, 1)

          if '    subjectRepository: SubjectRepository,\n' not in text:
              anchor = (
                  '    repository: app.masary.feature.home.domain.HomeRepository,\n'
                  '    subjectsRepository: SubjectsRepository,\n'
                  '    activityPreparationRepository: ActivityPreparationRepository,\n'
              )
              replacement = (
                  '    repository: app.masary.feature.home.domain.HomeRepository,\n'
                  '    subjectsRepository: SubjectsRepository,\n'
                  '    subjectRepository: SubjectRepository,\n'
                  '    activityPreparationRepository: ActivityPreparationRepository,\n'
              )
              if anchor not in text:
                  raise SystemExit('Phase 10 signature anchor not found')
              text = text.replace(anchor, replacement, 1)

          pattern = re.compile(
              r'                composable<StudentDestination\.SubjectDetails> \{ entry ->\n'
              r'.*?'
              r'(?=                composable<ActivityPreparationDestination>)',
              re.S,
          )
          new_route = '''                composable<StudentDestination.SubjectDetails> { entry ->
                      val destination = entry.toRoute<StudentDestination.SubjectDetails>()
                      StudentSubjectRoute(
                          subjectVersionId = destination.subjectVersionId,
                          repository = subjectRepository,
                          onBack = { navController.popBackStack() },
                          onSessionExpired = onLogout,
                          onTrainingCenter = { /* Phase 11 owns this destination. */ },
                      )
                  }
          '''
          text, count = pattern.subn(new_route, text, count=1)
          if count != 1:
              raise SystemExit(f'Phase 10 SubjectDetails route match count: {count}')
          path.write_text(text, encoding='utf-8')
          PY
          rm -f feature-home/src/main/java/app/masary/feature/home/ui/StudentHomeSubjectPageBridge.kt
          rm -f .github/workflows/phase10-route-integration.yml
          git show 60110b6bee37432a64712b3b69daad9082940cff:.github/workflows/android.yml > .github/workflows/android.yml
      - name: Commit focused route integration
        run: |
          git config user.name "masary-phase-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(home): replace placeholder with real subject page route"
          git push origin HEAD:phase-10-subject-page-implementation
