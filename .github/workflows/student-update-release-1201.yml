name: Student Phase12 Update 1201

on:
  push:
    branches:
      - release/student-phase12-update-1201

permissions:
  contents: read

jobs:
  build-signed-student-update:
    runs-on: ubuntu-latest
    env:
      MASARY_KEYSTORE_BASE64: ${{ secrets.MASARY_KEYSTORE_BASE64 }}
      MASARY_KEYSTORE_PASSWORD: ${{ secrets.MASARY_KEYSTORE_PASSWORD }}
      MASARY_KEY_ALIAS: ${{ secrets.MASARY_KEY_ALIAS }}
      MASARY_KEY_PASSWORD: ${{ secrets.MASARY_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Initialize signing runtime
        shell: bash
        run: echo "MASARY_KEYSTORE_PATH=$RUNNER_TEMP/masary-signing.jks" >> "$GITHUB_ENV"
      - name: Validate signing secrets
        shell: bash
        run: |
          required=(MASARY_KEYSTORE_BASE64 MASARY_KEYSTORE_PASSWORD MASARY_KEY_ALIAS MASARY_KEY_PASSWORD)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required signing secret is not configured: $name" >&2
              exit 1
            fi
          done
      - name: Prepare and verify keystore
        shell: bash
        run: |
          umask 077
          printf '%s' "$MASARY_KEYSTORE_BASE64" | base64 --decode > "$MASARY_KEYSTORE_PATH"
          keytool -list -keystore "$MASARY_KEYSTORE_PATH" -storepass "$MASARY_KEYSTORE_PASSWORD" -alias "$MASARY_KEY_ALIAS" >/dev/null
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Bootstrap Gradle wrapper
        run: ./scripts/bootstrap-gradle-wrapper.sh
      - name: Validate update metadata
        shell: bash
        run: |
          grep -F 'applicationId = "app.masary.student"' app-student/build.gradle.kts
          grep -F 'versionCode = 1201' app-student/build.gradle.kts
          grep -F 'versionName = "1.12.1"' app-student/build.gradle.kts
      - name: Build signed production update APK
        run: ./gradlew --no-daemon :app-student:assembleRelease
      - name: Verify production API target
        shell: bash
        run: |
          grep -R --fixed-strings 'MASARY_API_BASE_URL = "https://masary.app/"' app-student/build/generated/source/buildConfig/release
      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose app-student/build/outputs/apk/release/app-student-release.apk
      - name: Upload signed student update APK
        uses: actions/upload-artifact@v4
        with:
          name: masary-student-phase12-update-1201
          path: app-student/build/outputs/apk/release/app-student-release.apk
          if-no-files-found: error
      - name: Remove temporary keystore
        if: always()
        run: rm -f "${MASARY_KEYSTORE_PATH:-${RUNNER_TEMP}/masary-signing.jks}"
