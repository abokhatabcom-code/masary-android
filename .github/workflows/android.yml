name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apks:
    runs-on: ubuntu-latest
    env:
      MASARY_DEVELOPMENT_BASE_URL: ${{ vars.MASARY_DEVELOPMENT_BASE_URL }}
      MASARY_STAGING_BASE_URL: ${{ vars.MASARY_STAGING_BASE_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Phase 08 implementation and diagnostics
        id: phase08
        if: github.event_name == 'pull_request' && github.head_ref == 'phase-08-pre-activity-implementation'
        shell: bash
        run: |
          mkdir -p phase08-diagnostics
          if [[ -f feature-activity-preparation/build.gradle.kts ]]; then
            echo 'Phase 08 generated implementation already exists.' | tee phase08-diagnostics/apply.log
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'exit_code=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python3 automation/phase08_android.py >phase08-diagnostics/apply.log 2>&1
          code=$?
          if [[ $code -eq 0 ]]; then
            python3 automation/phase08_server.py >>phase08-diagnostics/apply.log 2>&1
            code=$?
          fi
          if [[ $code -eq 0 ]]; then
            python3 scripts/validate-api-contract.py >>phase08-diagnostics/apply.log 2>&1
            code=$?
          fi
          git status --short >phase08-diagnostics/status.txt
          git diff --binary >phase08-diagnostics/generated.patch
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [[ -s phase08-diagnostics/generated.patch ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload Phase 08 diagnostics
        if: github.event_name == 'pull_request' && github.head_ref == 'phase-08-pre-activity-implementation'
        uses: actions/upload-artifact@v4
        with:
          name: phase08-apply-diagnostics
          path: phase08-diagnostics/
          if-no-files-found: error
          retention-days: 7

      - name: Stop when Phase 08 generation failed
        if: steps.phase08.outputs.exit_code != '0'
        shell: bash
        run: |
          cat phase08-diagnostics/apply.log
          exit 1

      - name: Commit generated Phase 08 implementation
        if: steps.phase08.outputs.exit_code == '0' && steps.phase08.outputs.changed == 'true'
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- phase08-diagnostics
          git commit -m "feat: implement phase 08 pre-activity preparation"
          git push origin HEAD:"$HEAD_BRANCH"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap Gradle wrapper
        run: ./scripts/bootstrap-gradle-wrapper.sh

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Validate API contract
        run: python3 scripts/validate-api-contract.py

      - name: Run unit tests and Android lint
        run: ./gradlew --no-daemon test lint

      - name: Upload quality reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Build debug APKs
        run: ./gradlew --no-daemon :app-student:assembleDebug :app-admin:assembleDebug :app-pos:assembleDebug

      - name: Upload student debug APK
        uses: actions/upload-artifact@v4
        with:
          name: masary-student-debug-apk
          path: app-student/build/outputs/apk/debug/app-student-debug.apk
          if-no-files-found: error

      - name: Upload admin debug APK
        uses: actions/upload-artifact@v4
        with:
          name: masary-admin-debug-apk
          path: app-admin/build/outputs/apk/debug/app-admin-debug.apk
          if-no-files-found: error

      - name: Upload POS debug APK
        uses: actions/upload-artifact@v4
        with:
          name: masary-pos-debug-apk
          path: app-pos/build/outputs/apk/debug/app-pos-debug.apk
          if-no-files-found: error

  build-signed-debug-apks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      MASARY_DEVELOPMENT_BASE_URL: ${{ vars.MASARY_DEVELOPMENT_BASE_URL }}
      MASARY_STAGING_BASE_URL: ${{ vars.MASARY_STAGING_BASE_URL }}
      MASARY_KEYSTORE_BASE64: ${{ secrets.MASARY_KEYSTORE_BASE64 }}
      MASARY_KEYSTORE_PASSWORD: ${{ secrets.MASARY_KEYSTORE_PASSWORD }}
      MASARY_KEY_ALIAS: ${{ secrets.MASARY_KEY_ALIAS }}
      MASARY_KEY_PASSWORD: ${{ secrets.MASARY_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Initialize signing runtime
        shell: bash
        run: echo "MASARY_KEYSTORE_PATH=$RUNNER_TEMP/masary-signing.jks" >> "$GITHUB_ENV"

      - name: Validate signing secrets
        shell: bash
        run: |
          required=(
            MASARY_KEYSTORE_BASE64
            MASARY_KEYSTORE_PASSWORD
            MASARY_KEY_ALIAS
            MASARY_KEY_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required GitHub Actions secret is not configured: $name" >&2
              exit 1
            fi
          done

      - name: Prepare temporary keystore
        shell: bash
        run: |
          umask 077
          printf '%s' "$MASARY_KEYSTORE_BASE64" | base64 --decode > "$MASARY_KEYSTORE_PATH"

      - name: Verify temporary keystore
        shell: bash
        run: |
          keytool -list \
            -keystore "$MASARY_KEYSTORE_PATH" \
            -storepass "$MASARY_KEYSTORE_PASSWORD" \
            -alias "$MASARY_KEY_ALIAS" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap Gradle wrapper
        run: ./scripts/bootstrap-gradle-wrapper.sh

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Validate API contract
        run: python3 scripts/validate-api-contract.py

      - name: Run unit tests and Android lint
        run: ./gradlew --no-daemon test lint

      - name: Build signed debug APKs
        run: ./gradlew --no-daemon :app-student:assembleDebug :app-admin:assembleDebug :app-pos:assembleDebug

      - name: Upload signed student debug APK
        uses: actions/upload-artifact@v4
        with:
          name: masary-student-signed-debug-apk
          path: app-student/build/outputs/apk/debug/app-student-debug.apk
          if-no-files-found: error

      - name: Upload signed admin debug APK
        uses: actions/upload-artifact@v4
        with:
          name: masary-admin-signed-debug-apk
          path: app-admin/build/outputs/apk/debug/app-admin-debug.apk
          if-no-files-found: error

      - name: Upload signed POS debug APK
        uses: actions/upload-artifact@v4
        with:
          name: masary-pos-signed-debug-apk
          path: app-pos/build/outputs/apk/debug/app-pos-debug.apk
          if-no-files-found: error

      - name: Remove temporary keystore
        if: always()
        run: rm -f "${MASARY_KEYSTORE_PATH:-${RUNNER_TEMP}/masary-signing.jks}"
