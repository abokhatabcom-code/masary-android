name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Build student debug APK
        run: ./gradlew :app-student:assembleDebug

      - name: Build admin debug APK
        run: ./gradlew :app-admin:assembleDebug

      - name: Build POS debug APK
        run: ./gradlew :app-pos:assembleDebug

      - name: Upload student debug APK
        uses: actions/upload-artifact@v4
        with:
          name: masary-student-debug-apk
          path: app-student/build/outputs/apk/debug/app-student-debug.apk
          if-no-files-found: error

      - name: Upload admin debug APK
        uses: actions/upload-artifact@v4
        with:
          name: masary-admin-debug-apk
          path: app-admin/build/outputs/apk/debug/app-admin-debug.apk
          if-no-files-found: error

      - name: Upload POS debug APK
        uses: actions/upload-artifact@v4
        with:
          name: masary-pos-debug-apk
          path: app-pos/build/outputs/apk/debug/app-pos-debug.apk
          if-no-files-found: error
