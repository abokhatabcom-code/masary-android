name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apks:
    runs-on: ubuntu-latest
    env:
      MASARY_DEVELOPMENT_BASE_URL: ${{ vars.MASARY_DEVELOPMENT_BASE_URL }}
      MASARY_STAGING_BASE_URL: ${{ vars.MASARY_STAGING_BASE_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap Gradle wrapper
        run: ./scripts/bootstrap-gradle-wrapper.sh

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Validate API contract
        run: python3 scripts/validate-api-contract.py

      - name: Validate official student identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("app-student/build.gradle.kts").read_text(encoding="utf-8")
          strings = Path("app-student/src/main/res/values/strings.xml").read_text(encoding="utf-8")
          for marker in (
              'applicationId = "app.masary.student"',
              'versionCode = 1210',
              'versionName = "1.12.10"',
          ):
              if marker not in gradle:
                  raise SystemExit(f"Missing official identity marker: {marker}")
          if '<string name="app_name">مساري الطالب</string>' not in strings:
              raise SystemExit("Official app label must remain exactly: مساري الطالب")
          PY

      - name: Run unit tests and Android lint
        run: ./gradlew --no-daemon test lint

      - name: Upload quality reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Build debug APKs and student preview APK
        run: ./gradlew --no-daemon :app-student:assembleDebug :app-student:assemblePreview :app-admin:assembleDebug :app-pos:assembleDebug

      - name: Upload student debug APK
        uses: actions/upload-artifact@v4
        with:
          name: masary-student-debug-apk
          path: app-student/build/outputs/apk/debug/app-student-debug.apk
          if-no-files-found: error

      - name: Upload student preview APK
        uses: actions/upload-artifact@v4
        with:
          name: masary-student-preview-apk
          path: app-student/build/outputs/apk/preview/app-student-preview.apk
          if-no-files-found: error

      - name: Upload admin debug APK
        uses: actions/upload-artifact@v4
        with:
          name: masary-admin-debug-apk
          path: app-admin/build/outputs/apk/debug/app-admin-debug.apk
          if-no-files-found: error

      - name: Upload POS debug APK
        uses: actions/upload-artifact@v4
        with:
          name: masary-pos-debug-apk
          path: app-pos/build/outputs/apk/debug/app-pos-debug.apk
          if-no-files-found: error

  build-signed-production-student-apk:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.head_ref == 'phase-12-6-local-first-implementation')
    runs-on: ubuntu-latest
    env:
      MASARY_DEVELOPMENT_BASE_URL: ${{ vars.MASARY_DEVELOPMENT_BASE_URL }}
      MASARY_STAGING_BASE_URL: ${{ vars.MASARY_STAGING_BASE_URL }}
      MASARY_KEYSTORE_BASE64: ${{ secrets.MASARY_KEYSTORE_BASE64 }}
      MASARY_KEYSTORE_PASSWORD: ${{ secrets.MASARY_KEYSTORE_PASSWORD }}
      MASARY_KEY_ALIAS: ${{ secrets.MASARY_KEY_ALIAS }}
      MASARY_KEY_PASSWORD: ${{ secrets.MASARY_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Initialize signing runtime
        shell: bash
        run: echo "MASARY_KEYSTORE_PATH=$RUNNER_TEMP/masary-signing.jks" >> "$GITHUB_ENV"

      - name: Validate signing secrets
        shell: bash
        run: |
          required=(
            MASARY_KEYSTORE_BASE64
            MASARY_KEYSTORE_PASSWORD
            MASARY_KEY_ALIAS
            MASARY_KEY_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required GitHub Actions secret is not configured: $name" >&2
              exit 1
            fi
          done

      - name: Prepare temporary keystore
        shell: bash
        run: |
          umask 077
          printf '%s' "$MASARY_KEYSTORE_BASE64" | base64 --decode > "$MASARY_KEYSTORE_PATH"

      - name: Verify temporary keystore
        shell: bash
        run: |
          keytool -list \
            -keystore "$MASARY_KEYSTORE_PATH" \
            -storepass "$MASARY_KEYSTORE_PASSWORD" \
            -alias "$MASARY_KEY_ALIAS" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap Gradle wrapper
        run: ./scripts/bootstrap-gradle-wrapper.sh

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Validate API contract
        run: python3 scripts/validate-api-contract.py

      - name: Run student unit tests and lint
        if: github.event_name != 'pull_request'
        run: ./gradlew --no-daemon :app-student:test :app-student:lint

      - name: Verify official Masary Student identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("app-student/build.gradle.kts").read_text(encoding="utf-8")
          strings = Path("app-student/src/main/res/values/strings.xml").read_text(encoding="utf-8")

          required = [
              'applicationId = "app.masary.student"',
              'versionCode = 1210',
              'versionName = "1.12.10"',
          ]
          for marker in required:
              if marker not in gradle:
                  raise SystemExit(f"Missing official identity marker: {marker}")

          if '<string name="app_name">مساري الطالب</string>' not in strings:
              raise SystemExit("Official app label must remain exactly: مساري الطالب")
          PY

      - name: Build signed production student APK
        run: ./gradlew --no-daemon :app-student:assembleRelease

      - name: Verify official production APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app-student/build/outputs/apk/release/app-student-release.apk"

          grep -R --fixed-strings 'MASARY_API_BASE_URL = "https://masary.app/"' \
            app-student/build/generated/source/buildConfig/release

          python3 - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(
              Path("app-student/build/outputs/apk/release/output-metadata.json").read_text(encoding="utf-8")
          )
          element = metadata["elements"][0]
          if int(element["versionCode"]) != 1210:
              raise SystemExit("Official APK versionCode must be 1210.")
          if str(element["versionName"]) != "1.12.10":
              raise SystemExit("Official APK versionName must be 1.12.10.")
          PY

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"

          mkdir -p dist
          cp "$apk" "dist/مساري الطالب.apk"

      - name: Upload official Masary Student APK
        uses: actions/upload-artifact@v4
        with:
          name: masary-student-official-apk
          path: dist/مساري الطالب.apk
          if-no-files-found: error

      - name: Remove temporary keystore
        if: always()
        run: rm -f "${MASARY_KEYSTORE_PATH:-${RUNNER_TEMP}/masary-signing.jks}"
