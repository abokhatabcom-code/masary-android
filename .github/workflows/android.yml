name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase10-route-integration:
    if: github.event_name == 'pull_request' && github.head_ref == 'phase-10-subject-page-implementation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out phase branch
        uses: actions/checkout@v4
        with:
          ref: phase-10-subject-page-implementation
          fetch-depth: 2

      - name: Apply focused route patch and restore CI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('feature-home/src/main/java/app/masary/feature/home/ui/StudentHomePreparationRoute.kt')
          text = path.read_text(encoding='utf-8')

          import_anchor = '''import app.masary.feature.notifications.NotificationPermissionState
          import app.masary.feature.subjects.domain.SubjectsRepository
          import app.masary.feature.subjects.ui.StudentSubjectsRoute
          '''
          import_replacement = '''import app.masary.feature.notifications.NotificationPermissionState
          import app.masary.feature.subject.domain.SubjectRepository
          import app.masary.feature.subject.ui.StudentSubjectRoute
          import app.masary.feature.subjects.domain.SubjectsRepository
          import app.masary.feature.subjects.ui.StudentSubjectsRoute
          '''
          if import_anchor not in text:
              raise SystemExit('Phase 10 import anchor not found')
          text = text.replace(import_anchor, import_replacement, 1)

          signature_anchor = '''    repository: app.masary.feature.home.domain.HomeRepository,
              subjectsRepository: SubjectsRepository,
              activityPreparationRepository: ActivityPreparationRepository,
          '''
          signature_replacement = '''    repository: app.masary.feature.home.domain.HomeRepository,
              subjectsRepository: SubjectsRepository,
              subjectRepository: SubjectRepository,
              activityPreparationRepository: ActivityPreparationRepository,
          '''
          if signature_anchor not in text:
              raise SystemExit('Phase 10 signature anchor not found')
          text = text.replace(signature_anchor, signature_replacement, 1)

          old_route = '''                composable<StudentDestination.SubjectDetails> { entry ->
                          val destination = entry.toRoute<StudentDestination.SubjectDetails>()
                          PreparationDataDestination(data) { snapshot ->
                              val subject = snapshot.subjects.firstOrNull {
                                  it.subjectVersionId == destination.subjectVersionId
                              }
                              SimpleSection(
                                  title = subject?.name ?: "المادة الدراسية",
                                  body = "ستُستكمل الوحدات والدروس ومركز التدريب في مراحلها المخصصة. بدء أي نشاط يمر عبر شاشة التجهيز.",
                                  icon = Icons.AutoMirrored.Outlined.MenuBook,
                              )
                          }
                      }
          '''
          new_route = '''                composable<StudentDestination.SubjectDetails> { entry ->
                          val destination = entry.toRoute<StudentDestination.SubjectDetails>()
                          StudentSubjectRoute(
                              subjectVersionId = destination.subjectVersionId,
                              repository = subjectRepository,
                              onBack = { navController.popBackStack() },
                              onSessionExpired = onLogout,
                              onTrainingCenter = { /* Phase 11 owns this destination. */ },
                          )
                      }
          '''
          if old_route not in text:
              raise SystemExit('Phase 10 SubjectDetails route anchor not found')
          text = text.replace(old_route, new_route, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f feature-home/src/main/java/app/masary/feature/home/ui/StudentHomeSubjectPageBridge.kt
          rm -f .github/workflows/phase10-route-integration.yml
          git show HEAD^:.github/workflows/android.yml > .github/workflows/android.yml

      - name: Commit route integration
        run: |
          git config user.name "masary-phase-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(home): replace placeholder with real subject page route"
          git push origin HEAD:phase-10-subject-page-implementation

  build-debug-apks:
    runs-on: ubuntu-latest
    env:
      MASARY_DEVELOPMENT_BASE_URL: ${{ vars.MASARY_DEVELOPMENT_BASE_URL }}
      MASARY_STAGING_BASE_URL: ${{ vars.MASARY_STAGING_BASE_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap Gradle wrapper
        run: ./scripts/bootstrap-gradle-wrapper.sh

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Validate API contract
        run: python3 scripts/validate-api-contract.py

      - name: Run unit tests and Android lint
        run: ./gradlew --no-daemon test lint

      - name: Upload quality reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Build debug APKs
        run: ./gradlew --no-daemon :app-student:assembleDebug :app-admin:assembleDebug :app-pos:assembleDebug

      - name: Upload student debug APK
        uses: actions/upload-artifact@v4
        with:
          name: masary-student-debug-apk
          path: app-student/build/outputs/apk/debug/app-student-debug.apk
          if-no-files-found: error

      - name: Upload admin debug APK
        uses: actions/upload-artifact@v4
        with:
          name: masary-admin-debug-apk
          path: app-admin/build/outputs/apk/debug/app-admin-debug.apk
          if-no-files-found: error

      - name: Upload POS debug APK
        uses: actions/upload-artifact@v4
        with:
          name: masary-pos-debug-apk
          path: app-pos/build/outputs/apk/debug/app-pos-debug.apk
          if-no-files-found: error

  build-signed-debug-apks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      MASARY_DEVELOPMENT_BASE_URL: ${{ vars.MASARY_DEVELOPMENT_BASE_URL }}
      MASARY_STAGING_BASE_URL: ${{ vars.MASARY_STAGING_BASE_URL }}
      MASARY_KEYSTORE_BASE64: ${{ secrets.MASARY_KEYSTORE_BASE64 }}
      MASARY_KEYSTORE_PASSWORD: ${{ secrets.MASARY_KEYSTORE_PASSWORD }}
      MASARY_KEY_ALIAS: ${{ secrets.MASARY_KEY_ALIAS }}
      MASARY_KEY_PASSWORD: ${{ secrets.MASARY_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Initialize signing runtime
        shell: bash
        run: echo "MASARY_KEYSTORE_PATH=$RUNNER_TEMP/masary-signing.jks" >> "$GITHUB_ENV"

      - name: Validate signing secrets
        shell: bash
        run: |
          required=(
            MASARY_KEYSTORE_BASE64
            MASARY_KEYSTORE_PASSWORD
            MASARY_KEY_ALIAS
            MASARY_KEY_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required GitHub Actions secret is not configured: $name" >&2
              exit 1
            fi
          done

      - name: Prepare temporary keystore
        shell: bash
        run: |
          umask 077
          printf '%s' "$MASARY_KEYSTORE_BASE64" | base64 --decode > "$MASARY_KEYSTORE_PATH"

      - name: Verify temporary keystore
        shell: bash
        run: |
          keytool -list \
            -keystore "$MASARY_KEYSTORE_PATH" \
            -storepass "$MASARY_KEYSTORE_PASSWORD" \
            -alias "$MASARY_KEY_ALIAS" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap Gradle wrapper
        run: ./scripts/bootstrap-gradle-wrapper.sh

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Validate API contract
        run: python3 scripts/validate-api-contract.py

      - name: Run unit tests and Android lint
        run: ./gradlew --no-daemon test lint

      - name: Build signed debug APKs
        run: ./gradlew --no-daemon :app-student:assembleDebug :app-admin:assembleDebug :app-pos:assembleDebug

      - name: Upload signed student debug APK
        uses: actions/upload-artifact@v4
        with:
          name: masary-student-signed-debug-apk
          path: app-student/build/outputs/apk/debug/app-student-debug.apk
          if-no-files-found: error

      - name: Upload signed admin debug APK
        uses: actions/upload-artifact@v4
        with:
          name: masary-admin-signed-debug-apk
          path: app-admin/build/outputs/apk/debug/app-admin-debug.apk
          if-no-files-found: error

      - name: Upload signed POS debug APK
        uses: actions/upload-artifact@v4
        with:
          name: masary-pos-signed-debug-apk
          path: app-pos/build/outputs/apk/debug/app-pos-debug.apk
          if-no-files-found: error

      - name: Remove temporary keystore
        if: always()
        run: rm -f "${MASARY_KEYSTORE_PATH:-${RUNNER_TEMP}/masary-signing.jks}"
